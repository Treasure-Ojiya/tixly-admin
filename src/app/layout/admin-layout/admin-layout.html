<!-- SUPER ADMIN LAYOUT -->
<div
  class="fixed inset-0 flex overflow-hidden bg-surface text-ink"
  (keydown.escape)="closeMobileMenu()"
>
  <!-- Mobile backdrop -->
  @if (mobileMenuOpen) {
    <div
      class="fixed inset-0 z-40 bg-black/40 md:hidden"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>
  }

  <!-- ═════════ SIDEBAR ═════════ -->
  <aside
    id="admin-sidebar"
    class="fixed inset-y-0 left-0 z-50 flex w-64 shrink-0 flex-col bg-nav text-white/70 shadow-xl transition-[transform,width] duration-300 md:static md:z-auto md:translate-x-0 md:shadow-none"
    [ngClass]="{
      'translate-x-0': mobileMenuOpen,
      '-translate-x-full': !mobileMenuOpen,
      'md:w-64': !isCollapsed,
      'md:w-20': isCollapsed,
    }"
  >
    <!-- Brand -->
    <div
      class="flex h-16 shrink-0 items-center gap-3 border-b border-white/10 px-5"
      [ngClass]="{ 'md:justify-center md:gap-0 md:px-0': isCollapsed }"
    >
      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-accent text-base font-bold text-ink"
        aria-hidden="true"
        >T</span
      >
      <img src="assets/logo/tixly-logo.png" class="w-6" [ngClass]="{ 'md:hidden': isCollapsed }" />
      <span
        class="rounded border border-accent/60 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-widest text-accent"
        [ngClass]="{ 'md:hidden': isCollapsed }"
        >Admin</span
      >
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-5 overflow-y-auto px-3 py-6" aria-label="Admin">
      @for (group of navGroups; track group.label; let first = $first) {
        <div>
          <!-- Group label (expanded) / divider (collapsed) -->
          <p
            class="mb-2 px-3 text-[11px] font-semibold uppercase tracking-widest text-white/50"
            [ngClass]="{ 'md:hidden': isCollapsed }"
          >
            {{ group.label }}
          </p>
          @if (!first) {
            <div
              class="mx-3 mb-3 hidden h-px bg-white/10"
              [ngClass]="{ 'md:block': isCollapsed }"
              aria-hidden="true"
            ></div>
          }

          <div class="space-y-1">
            @for (item of group.items; track item.link) {
              <a
                [routerLink]="item.link"
                routerLinkActive="bg-white/10 text-white before:opacity-100 [&>i]:text-accent"
                ariaCurrentWhenActive="page"
                [attr.title]="isCollapsed ? item.label : null"
                (click)="closeMobileMenu()"
                class="relative flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-white/10 hover:text-white before:absolute before:left-0 before:top-1/2 before:h-5 before:w-1 before:-translate-y-1/2 before:rounded-r before:bg-accent before:opacity-0 before:transition-opacity"
                [ngClass]="{ 'md:justify-center md:gap-0': isCollapsed }"
              >
                <i
                  class="fas w-4 shrink-0 text-center text-white/50"
                  [ngClass]="item.icon"
                  aria-hidden="true"
                ></i>

                <span [ngClass]="{ 'md:sr-only': isCollapsed }">{{ item.label }}</span>
              </a>
            }
          </div>
        </div>
      }
    </nav>

    <!-- Signed-in admin + logout, pinned to the bottom -->
    <div class="shrink-0 border-t border-white/10 p-3">
      <div
        class="flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2.5"
        [ngClass]="{ 'md:flex-col md:gap-2 md:px-1': isCollapsed }"
      >
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-accent text-sm font-bold uppercase text-ink"
          [attr.title]="isCollapsed ? adminName : null"
          aria-hidden="true"
          >{{ adminInitials }}</span
        >

        <div class="min-w-0 flex-1" [ngClass]="{ 'md:hidden': isCollapsed }">
          <p class="truncate text-sm font-semibold text-white">{{ adminName }}</p>
          <p class="truncate text-xs text-white/60">{{ adminEmail }}</p>
        </div>

        <button
          type="button"
          (click)="logout()"
          aria-label="Log out"
          title="Log out"
          class="rounded-lg p-2 text-white/60 transition-colors hover:bg-white/10 hover:text-accent cursor-pointer"
        >
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═════════ MAIN COLUMN ═════════ -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Topbar -->
    <header
      class="flex h-16 shrink-0 items-center justify-between gap-4 border-b-2 border-brand bg-white px-4 sm:px-6"
    >
      <div class="flex items-center gap-3">
        <!-- Mobile: open the drawer -->
        <button
          type="button"
          (click)="toggleMobileMenu()"
          aria-label="Toggle navigation menu"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="mobileMenuOpen"
          class="rounded-lg p-2 text-ink transition-colors hover:bg-brand-soft cursor-pointer md:hidden"
        >
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Desktop: collapse / expand the sidebar -->
        <button
          type="button"
          (click)="toggleSidebar()"
          [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="!isCollapsed"
          class="hidden rounded-lg p-2 text-ink transition-colors hover:bg-brand-soft cursor-pointer md:inline-flex"
        >
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <p class="text-sm font-semibold text-ink">Platform administration</p>
      </div>

      <div class="flex items-center gap-3">
        <span
          class="hidden items-center gap-1.5 rounded-full bg-accent px-3 py-1 text-xs font-semibold text-ink sm:inline-flex"
        >
          <i class="fas fa-shield-alt text-[10px]" aria-hidden="true"></i>
          Super admin
        </span>

        <button
          type="button"
          (click)="logout()"
          class="inline-flex items-center gap-2 rounded-lg border border-ink/20 px-3 py-1.5 text-sm font-semibold text-ink transition-colors hover:bg-brand-soft cursor-pointer"
        >
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          Log out
        </button>
      </div>
    </header>

    <!-- The only scroll container on the page -->
    <main
      id="main-content"
      class="min-h-0 min-w-0 flex-1 overflow-y-auto overflow-x-hidden bg-surface"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
